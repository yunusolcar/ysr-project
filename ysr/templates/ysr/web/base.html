<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gençler İçin Kendini Değerlendirme Anketi</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --soft: #eef2fb;
    --text: #1c2330;
    --muted: #5f6b7a;
    --border: #d9dee6;
    --accent: #2457d6;
    --err: #c62828;
    --err-bg: #fdecec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --soft: #1d2433;
      --text: #e8ebf0;
      --muted: #98a2b3;
      --border: #2b303b;
      --accent: #3d6fe0;
      --err: #ff7b7b;
      --err-bg: #2a1718;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  .topbar { background: var(--card); border-bottom: 1px solid var(--border); }
  .topbar .wrap { padding-top: 14px; padding-bottom: 14px; font-weight: 600; }
  main { padding-top: 8px; padding-bottom: 24px; }
  footer { padding: 16px 0 32px; color: var(--muted); font-size: 0.875em; }

  h1 { font-size: 1.5rem; margin: 24px 0 8px; }
  h2 { font-size: 1.375rem; margin: 6px 0 4px; }
  .lead { margin: 4px 0 0; }
  .muted { color: var(--muted); font-size: 0.9em; }

  .page-head { margin: 20px 0 14px; }
  .eyebrow { color: var(--muted); font-size: 0.875em; }
  .progress { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
  .progress div { height: 100%; background: var(--accent); border-radius: 99px; }

  .legend {
    position: sticky; top: 0; z-index: 2; margin: 0 0 12px; padding: 10px 14px;
    background: var(--soft); border: 1px solid var(--border); border-radius: 10px; font-size: 0.9em;
  }
  .alert { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--err-bg); color: var(--err); border: 1px solid var(--err); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .card.pad { padding: 8px 24px 24px; }
  .q { padding: 16px 20px; border-top: 1px solid var(--border); }
  .card > .q:first-child, .card > .q-header:first-child { border-top: 0; }
  .q.child { padding-left: 44px; }
  .q.has-error { background: var(--err-bg); box-shadow: inset 4px 0 0 var(--err); }
  .q-header { padding: 14px 20px; background: var(--soft); border-top: 1px solid var(--border); font-weight: 600; }
  .q-text { margin: 0 0 10px; }
  .code { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .error { color: var(--err); margin: 8px 0 0; font-size: 0.9em; }

  .k-scale { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .k-scale .q-text { margin: 0; flex: 1 1 280px; }
  .k-scale .choices { flex: none; }
  .k-scale .error { flex-basis: 100%; margin: 0; }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices label { position: relative; cursor: pointer; }
  .choices input { position: absolute; opacity: 0; inset: 0; }
  .choices span {
    display: inline-block; min-width: 48px; min-height: 40px; padding: 8px 16px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  }
  .choices label:hover span { border-color: var(--accent); }
  .choices input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .choices input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  input[type=text], input[type=number], select, textarea {
    width: 100%; min-height: 40px; padding: 8px 10px; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select option { background: var(--card); color: var(--text); }
  input:disabled, select:disabled { opacity: 0.45; cursor: not-allowed; }
  input::placeholder { color: var(--muted); }
  .q input[type=text].explain { margin-top: 10px; }

  .none-box {
    display: inline-flex; gap: 8px; align-items: center; margin: 6px 0 14px; padding: 8px 14px;
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  .none-box input { width: 18px; height: 18px; min-height: 0; }
  .alist {
    display: grid; align-items: center; gap: 8px 10px;
    grid-template-columns: 1.6rem minmax(0, 1fr) repeat(var(--cols, 2), minmax(0, 200px));
  }
  .alist.is-off { opacity: 0.5; }
  .alist .ahead { align-self: end; color: var(--muted); font-size: 0.8em; }
  .alist .aletter { color: var(--muted); text-align: right; }
  .asel .short { display: none; }

  .nav {
    position: sticky; bottom: 0; display: flex; flex-direction: row-reverse; justify-content: space-between;
    margin-top: 16px; padding: 12px 0; background: var(--bg); border-top: 1px solid var(--border);
  }
  .btn {
    min-height: 44px; padding: 10px 24px; font: inherit; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: 8px;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.secondary { color: var(--text); background: var(--card); border-color: var(--border); font-weight: 500; }

  .start-form div { margin-bottom: 16px; }
  .start-form label { font-weight: 600; display: block; margin-bottom: 4px; }
  .start-form div div { margin: 0 0 4px; }
  .start-form div div label { font-weight: 400; display: inline-flex; gap: 6px; align-items: center; margin-right: 16px; }
  .start-form input[type=radio] { width: auto; min-height: 0; }
  .start-form fieldset { border: 0; padding: 0; margin: 0 0 16px; }
  .start-form legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
  .actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  .helptext { display: block; color: var(--muted); font-size: 0.875em; }
  ul.errorlist { color: var(--err); list-style: none; padding: 0; margin: 4px 0; }
  .done { text-align: center; padding: 40px 24px; }
  .done .tick { font-size: 2.5rem; color: var(--accent); }

  @media (max-width: 640px) {
    .q { padding: 14px 16px; }
    .q.child { padding-left: 28px; }
    .k-scale { align-items: stretch; }
    .alist { grid-template-columns: 1.6rem minmax(0, 1fr); }
    .alist .ahead { display: none; }
    .alist .asel { grid-column: 2; display: flex; align-items: center; gap: 8px; }
    .alist .asel .short { display: inline; min-width: 4.5em; color: var(--muted); font-size: 0.85em; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">Gençler İçin Kendini Değerlendirme Anketi</div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap">
  Bu sayfa bir deneme sürümüdür. Kendini kötü hissediyorsan güvendiğin bir yetişkinle konuş.
</footer>
</body>
</html>
