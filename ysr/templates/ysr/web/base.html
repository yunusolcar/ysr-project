<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gençler İçin Kendini Değerlendirme Anketi</title>
<style>
  :root { color-scheme: light dark; --accent: #2f6fed; --border: rgba(128, 128, 128, 0.4); --err: #c62828; }
  body { font-family: system-ui, sans-serif; max-width: 780px; margin: 0 auto; padding: 16px; line-height: 1.5; }
  h1 { font-size: 1.5em; }
  h2 { margin-bottom: 4px; }
  .muted { opacity: 0.7; font-size: 0.9em; }
  .progress { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 6px 0 16px; }
  .progress div { height: 100%; background: var(--accent); }
  .legend { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; }
  .q { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .q.child { margin-left: 24px; }
  .q.has-error { border-left: 4px solid var(--err); padding-left: 10px; }
  .q-header { margin: 18px 0 0; font-weight: 600; }
  .q-text { margin: 0 0 8px; }
  .code { opacity: 0.6; margin-right: 6px; }
  .error { color: var(--err); margin: 6px 0 0; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices label { position: relative; cursor: pointer; }
  .choices input { position: absolute; opacity: 0; }
  .choices span { display: inline-block; min-width: 44px; text-align: center; padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; }
  .choices input:checked + span { background: var(--accent); color: #fff; border-color: var(--accent); }
  .choices input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=text], input[type=number], select { padding: 8px; border: 1px solid var(--border); border-radius: 8px; font: inherit; background: transparent; color: inherit; }
  .q input[type=text] { width: 100%; box-sizing: border-box; margin-top: 8px; }
  textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--border); border-radius: 8px; font: inherit; background: transparent; color: inherit; }
  fieldset.row { border: 1px dashed var(--border); border-radius: 8px; margin: 8px 0; }
  .selects { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .selects label { display: flex; flex-direction: column; font-size: 0.9em; gap: 4px; }
  .nav { display: flex; flex-direction: row-reverse; justify-content: space-between; margin-top: 24px; }
  .btn { padding: 10px 22px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  .btn.secondary { background: transparent; color: inherit; border-color: var(--border); }
  form div { margin-bottom: 12px; }
  .helptext { display: block; opacity: 0.7; font-size: 0.9em; }
  ul.errorlist { color: var(--err); list-style: none; padding: 0; margin: 4px 0; }
  footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--border); }
  select, select option { background-color: Canvas; color: CanvasText; }
</style>
</head>
<body>
{% block content %}{% endblock %}
<footer class="muted">Bu sayfa bir deneme sürümüdür. Kendini kötü hissediyorsan güvendiğin bir yetişkinle konuş.</footer>
</body>
</html>
